name: Patch verified face targets (PR)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-verified-targets-pr.yml"
      - "tools/patch_verified_targets.py"
      - "tools/filter_faces.py"
      - "generated/dominican_public_figures_complete_50.zip"
      - "generated/replacement_face_manifest.csv"
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-face-filter.txt
      - name: Patch exact targets
        id: patch
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/patch_verified_targets.py 2>&1 | tee patch.log
      - name: Summarize
        if: always()
        run: |
          python - <<'PY'
          import csv, pathlib, zipfile
          p=pathlib.Path('replacement_face_manifest.csv')
          if not p.exists():
              pathlib.Path('patch_summary.txt').write_text('manifest_missing=true\n'); raise SystemExit(0)
          rows=list(csv.DictReader(p.open(encoding='utf-8')))
          missing=[r for r in rows if r['status']=='missing']
          n=0
          if pathlib.Path('dominican_public_figures_complete_50.zip').exists():
              with zipfile.ZipFile('dominican_public_figures_complete_50.zip') as z:
                  n=sum(pathlib.Path(x).suffix.lower() in {'.jpg','.jpeg','.png','.webp','.bmp','.tif','.tiff'} for x in z.namelist())
          text=f'images_in_zip={n}\nmissing={len(missing)}\n'+''.join(f"MISSING {r['index']} {r['name']}\n" for r in missing)
          pathlib.Path('patch_summary.txt').write_text(text); print(text)
          PY
      - name: Upload patched ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-50-face-patched
          path: |
            dominican_public_figures_complete_50.zip
            replacement_face_manifest.csv
            patch_summary.txt
            patch.log
          if-no-files-found: warn
      - name: Require 50
        if: always()
        run: |
          python - <<'PY'
          import csv, pathlib, sys
          p=pathlib.Path('replacement_face_manifest.csv')
          if not p.exists(): sys.exit(1)
          rows=list(csv.DictReader(p.open(encoding='utf-8')))
          if len(rows)!=50 or any(r['status']=='missing' for r in rows): sys.exit(1)
          print('50/50 identity-safe faces present')
          PY

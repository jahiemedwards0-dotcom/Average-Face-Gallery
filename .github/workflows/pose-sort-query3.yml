name: Sort query-3 portraits by pose

on:
  push:
    branches:
      - chatgpt/pose-sort-query3
    paths:
      - ".github/workflows/pose-sort-query3.yml"
  workflow_dispatch:

jobs:
  sort-portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas requests pillow numpy opencv-python-headless mediapipe==0.10.21

      - name: Download and sort portraits
        run: python pose_sort/sort_query3.py

      - name: Show summary
        if: always()
        run: |
          if [ -f pose_sort_output/summary.json ]; then
            cat pose_sort_output/summary.json
          fi

      - name: Upload sorted image folders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-3-pose-sorted-images
          path: pose_sort_output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

name: Face detection gate

on:
  pull_request:
    paths:
      - "images/**"
      - "tools/filter_faces.py"
      - "requirements-face-filter.txt"
      - ".github/workflows/face-detection-gate.yml"
  push:
    branches: [main]
    paths:
      - "images/**"
      - "tools/filter_faces.py"
      - "requirements-face-filter.txt"
      - ".github/workflows/face-detection-gate.yml"
  workflow_dispatch:

jobs:
  validate-faces:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-face-filter.txt

      - name: Install face detector
        run: pip install -r requirements-face-filter.txt

      - name: Check every face asset with strict YuNet detection
        run: |
          python tools/filter_faces.py images \
            --exclude-glob "*map*" \
            --manifest face_detection_manifest.csv \
            --fail-on-rejected

      - name: Upload detection manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: face-detection-manifest
          path: face_detection_manifest.csv
          if-no-files-found: warn

name: Build complete 50-face public-figure ZIP

on:
  push:
    branches: [agent/face-detection-gate]
    paths:
      - ".github/workflows/build-filtered-public-figures.yml"
      - "tools/refill_public_figures.py"
      - "tools/filter_faces.py"
      - "data/dominican_public_figures_manifest.csv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install face detector
        run: pip install -r requirements-face-filter.txt

      - name: Download original 50-image archive
        run: |
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://at.adobe.com/d5pYYYExEZ2ZpFvo" \
            -o public_figures_source.zip
          unzip -t public_figures_source.zip

      - name: Keep passing originals and refill failed people
        id: refill
        continue-on-error: true
        run: |
          set -o pipefail
          python tools/refill_public_figures.py \
            --roster data/dominican_public_figures_manifest.csv \
            --source-zip public_figures_source.zip \
            --output dominican_public_figures_complete_50.zip \
            --manifest replacement_face_manifest.csv \
            --max-candidates 40 2>&1 | tee refill.log

      - name: Summarize result or failure
        if: always()
        run: |
          python - <<'PY'
          import csv, pathlib, zipfile
          manifest = pathlib.Path('replacement_face_manifest.csv')
          output = pathlib.Path('dominican_public_figures_complete_50.zip')
          if manifest.exists():
              rows = list(csv.DictReader(manifest.open(encoding='utf-8')))
              kept = sum(r['status'] == 'kept-original' for r in rows)
              replaced = sum(r['status'] == 'replacement' for r in rows)
              missing = [r for r in rows if r['status'] == 'missing']
              imgs = []
              if output.exists():
                  with zipfile.ZipFile(output) as z:
                      imgs = [n for n in z.namelist() if pathlib.Path(n).suffix.lower() in {'.jpg','.jpeg','.png','.webp','.bmp','.tif','.tiff'}]
              summary = (
                  f'images_in_zip={len(imgs)}\n'
                  f'kept_original={kept}\n'
                  f'replacements={replaced}\n'
                  f'missing={len(missing)}\n'
                  + ''.join(f"MISSING {r['index']} {r['name']}\n" for r in missing)
              )
          else:
              summary = 'refill_script_failed_before_manifest=true\n'
          pathlib.Path('face_filter_summary.txt').write_text(summary, encoding='utf-8')
          print(summary)
          PY

      - name: Upload complete/refill artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dominican-public-figures-complete-50
          path: |
            dominican_public_figures_complete_50.zip
            replacement_face_manifest.csv
            face_filter_summary.txt
            refill.log
          if-no-files-found: warn

      - name: Publish generated result and diagnostics to branch
        if: always()
        run: |
          mkdir -p generated
          for f in dominican_public_figures_complete_50.zip replacement_face_manifest.csv face_filter_summary.txt refill.log; do
            if [ -f "$f" ]; then cp "$f" generated/; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          if git diff --cached --quiet; then
            echo "No generated changes to publish"
          else
            git commit -m "Publish regenerated face ZIP diagnostics"
            git push origin HEAD:agent/face-detection-gate
          fi

      - name: Require all 50 faces
        if: always()
        run: |
          python - <<'PY'
          import csv, pathlib, sys
          p = pathlib.Path('replacement_face_manifest.csv')
          if not p.exists():
              sys.exit('replacement manifest missing')
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          missing = [r for r in rows if r['status'] == 'missing']
          if missing:
              print(f'{len(missing)} people still missing a passing face image')
              sys.exit(1)
          print('All 50 roster entries have a YuNet-detectable face image.')
          PY

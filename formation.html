<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Mulattid Formation — Animated 9:16 Layer</title>
  <style>
    :root {
      --ink: #171710;
      --paper: #f4efdF;
      --ocean: #dce9e6;
      --land: #d6c99c;
      --land-edge: #6e684e;
      --iberian: #b33d2f;
      --taino: #d7902d;
      --african: #385f92;
      --muted: #6d6a5e;
      --cream: #fffaf0;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
    body { display: grid; place-items: center; font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }

    .film {
      position: relative;
      width: min(100vw, 56.25vh);
      height: min(100vh, 177.7778vw);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 16%, rgba(255,255,255,.88), transparent 34%),
        repeating-linear-gradient(0deg, rgba(23,23,16,.018) 0 1px, transparent 1px 5px),
        var(--paper);
      isolation: isolate;
    }

    .film::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 1px rgba(23,23,16,.12), inset 0 0 70px rgba(35,28,10,.09);
      z-index: 30;
    }

    svg { width: 100%; height: 100%; display: block; }

    #camera { transform-origin: 0 0; will-change: transform; }
    #ocean-lines path {
      fill: none;
      stroke: #86a8a3;
      stroke-width: 3;
      opacity: .28;
      stroke-dasharray: 20 16;
      animation: current 4.8s linear infinite;
    }
    @keyframes current { to { stroke-dashoffset: -72; } }

    .land {
      fill: var(--land);
      stroke: var(--land-edge);
      stroke-width: 5;
      vector-effect: non-scaling-stroke;
    }
    .coast-detail { fill: none; stroke: #918765; stroke-width: 2; opacity: .55; vector-effect: non-scaling-stroke; }
    .island { fill: #d6c99c; stroke: #6e684e; stroke-width: 3; vector-effect: non-scaling-stroke; }
    .island.pulse { animation: islandPulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes islandPulse { 50% { transform: scale(1.09); fill: #e4a444; } }

    .map-label {
      font-size: 32px;
      font-weight: 850;
      letter-spacing: .14em;
      fill: #38372f;
      paint-order: stroke;
      stroke: var(--paper);
      stroke-width: 10;
      stroke-linejoin: round;
    }
    .map-label.small { font-size: 22px; letter-spacing: .08em; }

    .route {
      fill: none;
      stroke: var(--iberian);
      stroke-width: 9;
      stroke-linecap: round;
      stroke-dasharray: 18 16;
      vector-effect: non-scaling-stroke;
      opacity: 0;
    }
    #route-africa { stroke: var(--african); }

    .ship-body { fill: #7b4b28; stroke: var(--ink); stroke-width: 5; }
    .ship-mast { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
    .ship-sail { fill: #fff9e8; stroke: var(--ink); stroke-width: 4; }
    .ship-flag { fill: var(--iberian); }
    .ship { opacity: 0; filter: drop-shadow(0 12px 8px rgba(0,0,0,.17)); }

    .stick { overflow: visible; }
    .stick .bone { stroke: var(--ink); stroke-width: 8; stroke-linecap: round; fill: none; }
    .stick .head { stroke: var(--ink); stroke-width: 7; fill: var(--cream); }
    .stick .clothes { stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
    .stick .detail { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; fill: none; }
    .world-object .detail { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; fill: none; }
    .stick .taino-cloth { fill: var(--taino); }
    .stick .iberian-cloth { fill: var(--iberian); }
    .stick .african-cloth { fill: var(--african); }

    .hut-roof { fill: #a46f34; stroke: var(--ink); stroke-width: 5; }
    .hut-wall { fill: #d7b36a; stroke: var(--ink); stroke-width: 5; }
    .fort { fill: #d0c5aa; stroke: var(--ink); stroke-width: 6; }
    .mine { fill: #5f5546; stroke: var(--ink); stroke-width: 6; }
    .sugar { fill: #5f8c5d; stroke: var(--ink); stroke-width: 4; }

    .world-object { opacity: 0; transition: opacity .3s linear; }
    .visible { opacity: 1; }

    .figure-row .stick { opacity: 0; transform-box: fill-box; transform-origin: center bottom; }
    .scene-collapse .stick { transition: opacity .45s ease, transform .45s ease; }

    .caption {
      position: absolute;
      left: 7.4%;
      right: 7.4%;
      top: 7.5%;
      z-index: 20;
      pointer-events: none;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
      font-size: clamp(11px, 2.4vw, 19px);
      font-weight: 900;
      letter-spacing: .19em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .eyebrow::before { content: ""; width: 34px; height: 4px; background: currentColor; border-radius: 9px; }
    .headline {
      max-width: 94%;
      margin: 0;
      font-size: clamp(36px, 8.8vw, 76px);
      line-height: .93;
      letter-spacing: -.055em;
      font-weight: 950;
      text-wrap: balance;
    }
    .subline {
      margin-top: 13px;
      max-width: 82%;
      color: #4e4b40;
      font-size: clamp(13px, 3.1vw, 24px);
      line-height: 1.2;
      font-weight: 720;
    }
    .caption > * { opacity: 0; transform: translateY(20px); transition: opacity .45s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
    .caption.show > * { opacity: 1; transform: translateY(0); }
    .caption.show .headline { transition-delay: .06s; }
    .caption.show .subline { transition-delay: .12s; }

    .date-stamp {
      position: absolute;
      right: 6%;
      top: 7%;
      z-index: 21;
      min-width: 130px;
      padding: 11px 16px 10px;
      border: 4px solid var(--ink);
      background: rgba(255,250,240,.9);
      font-size: clamp(20px, 5.8vw, 45px);
      line-height: 1;
      text-align: center;
      font-weight: 950;
      letter-spacing: -.04em;
      transform: rotate(2deg) scale(.85);
      opacity: 0;
      transition: opacity .3s ease, transform .45s cubic-bezier(.2,.8,.2,1);
    }
    .date-stamp.show { opacity: 1; transform: rotate(2deg) scale(1); }

    .dna-card {
      position: absolute;
      inset: 13% 7.4% auto;
      z-index: 24;
      padding: 26px 24px 25px;
      border: 5px solid var(--ink);
      border-radius: 7px;
      background: rgba(255,250,240,.96);
      box-shadow: 12px 12px 0 rgba(23,23,16,.14);
      opacity: 0;
      transform: translateY(45px) rotate(-1deg);
      pointer-events: none;
      transition: opacity .45s ease, transform .55s cubic-bezier(.2,.8,.2,1);
    }
    .dna-card.show { opacity: 1; transform: translateY(0) rotate(-1deg); }
    .dna-title { font-size: clamp(23px, 5.6vw, 46px); font-weight: 950; letter-spacing: -.04em; }
    .dna-note { margin-top: 5px; color: var(--muted); font-weight: 750; font-size: clamp(11px, 2.6vw, 20px); }
    .bar { display: grid; grid-template-columns: 52fr 40fr 8fr; height: 44px; margin: 22px 0 17px; border: 4px solid var(--ink); overflow: hidden; }
    .bar span:nth-child(1) { background: var(--iberian); }
    .bar span:nth-child(2) { background: var(--african); }
    .bar span:nth-child(3) { background: var(--taino); }
    .legend { display: grid; gap: 11px; }
    .legend-row { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; font-size: clamp(12px, 3vw, 22px); font-weight: 830; }
    .swatch { width: 18px; height: 18px; border: 3px solid var(--ink); }
    .legend-row:nth-child(1) .swatch { background: var(--iberian); }
    .legend-row:nth-child(2) .swatch { background: var(--african); }
    .legend-row:nth-child(3) .swatch { background: var(--taino); }

    .progress {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 9px;
      background: rgba(23,23,16,.12);
      z-index: 40;
    }
    .progress > i { display: block; height: 100%; width: 0%; background: var(--ink); }

    .controls {
      position: absolute;
      left: 5.5%;
      right: 5.5%;
      bottom: 2.4%;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: .28;
      transition: opacity .2s ease;
    }
    .film:hover .controls, .film.paused .controls { opacity: 1; }
    button {
      appearance: none;
      border: 3px solid var(--ink);
      border-radius: 99px;
      background: rgba(255,250,240,.88);
      color: var(--ink);
      padding: 9px 13px;
      font: 850 12px/1 ui-sans-serif,system-ui,sans-serif;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .scene-dot { font-size: 12px; font-weight: 900; letter-spacing: .11em; text-transform: uppercase; padding: 8px 11px; background: rgba(255,250,240,.76); }
    .clean .controls, .clean .progress { display: none; }

    @media (prefers-reduced-motion: reduce) {
      #ocean-lines path, .island.pulse { animation: none; }
    }
  </style>
</head>

  <script>
    (() => {
      const TOTAL = 31500;
      const film = document.getElementById('film');
      const camera = document.getElementById('camera');
      const caption = document.getElementById('caption');
      const eyebrow = document.getElementById('eyebrow');
      const headline = document.getElementById('headline');
      const subline = document.getElementById('subline');
      const dateStamp = document.getElementById('dateStamp');
      const dnaCard = document.getElementById('dnaCard');
      const progressBar = document.getElementById('progressBar');
      const playPause = document.getElementById('playPause');
      const restart = document.getElementById('restart');
      const sceneLabel = document.getElementById('sceneLabel');
      const routeIberia = document.getElementById('route-iberia');
      const routeAfrica = document.getElementById('route-africa');
      const shipIberia = document.getElementById('shipIberia');
      const shipAfrica = document.getElementById('shipAfrica');
      const tainoWorld = document.getElementById('tainoWorld');
      const colonialIntrusion = document.getElementById('colonialIntrusion');
      const africanArrival = document.getElementById('africanArrival');
      const colonialSociety = document.getElementById('colonialSociety');

      const query = new URLSearchParams(location.search);
      if (query.get('clean') === '1') film.classList.add('clean');

      const scenes = [
        { start: 0, end: 2500, name: 'Opening', eyebrow: 'Formation', headline: 'The colonial Caribbean', subline: 'A population formed across three continents.' },
        { start: 2500, end: 8000, name: 'Atlantic crossing', eyebrow: 'Searching for Asia', headline: 'Iberian ships sailed west.', subline: 'Instead, they reached the Caribbean.', date: '1492' },
        { start: 8000, end: 13000, name: 'Taíno world', eyebrow: 'Hispaniola', headline: 'The island was already inhabited.', subline: 'Taíno towns, farms and political territories.', date: '1492' },
        { start: 13000, end: 16500, name: 'Colonial collapse', eyebrow: 'Spanish conquest', headline: 'The population collapsed.', subline: 'Forced labor · warfare · famine · epidemics' },
        { start: 16500, end: 22000, name: 'African trafficking', eyebrow: 'Forced migration', headline: 'The Spanish turned toward Africa.', subline: 'West and West-Central African captives were transported to Hispaniola.', date: '1502–1518' },
        { start: 22000, end: 27000, name: 'Colonial society', eyebrow: 'Across generations', headline: 'Three populations entered one society.', subline: 'Iberian · African · surviving Taíno' },
        { start: 27000, end: 31500, name: 'Genetic layer', eyebrow: '', headline: '', subline: '' }
      ];

      const cameraKeys = [
        { t: 0, x: 20, y: 40, s: .96 },
        { t: 2500, x: -615, y: -240, s: 1.72 },
        { t: 5200, x: -125, y: 10, s: 1.08 },
        { t: 8000, x: -760, y: -790, s: 2.55 },
        { t: 13000, x: -760, y: -790, s: 2.55 },
        { t: 16500, x: -120, y: -40, s: 1.08 },
        { t: 18500, x: -720, y: -760, s: 1.75 },
        { t: 22000, x: -760, y: -790, s: 2.55 },
        { t: 27000, x: -225, y: -230, s: 1.35 },
        { t: 31500, x: -225, y: -230, s: 1.35 }
      ];

      let running = query.get('autoplay') !== '0';
      let elapsed = Math.max(0, Math.min(TOTAL - 1, Number(query.get('t') || 0) * 1000));
      let last = performance.now();
      let activeScene = -1;

      const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
      const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const local = (start, end) => clamp((elapsed - start) / (end - start));

      function cameraAt(t) {
        let a = cameraKeys[0], b = cameraKeys[cameraKeys.length - 1];
        for (let i = 0; i < cameraKeys.length - 1; i++) {
          if (t >= cameraKeys[i].t && t <= cameraKeys[i + 1].t) { a = cameraKeys[i]; b = cameraKeys[i + 1]; break; }
        }
        const p = ease(clamp((t - a.t) / (b.t - a.t || 1)));
        return { x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p, s: a.s + (b.s - a.s) * p };
      }

      function placeOnPath(node, path, p, offset = 0) {
        const len = path.getTotalLength();
        const at = path.getPointAtLength(clamp(p) * len);
        const ahead = path.getPointAtLength(Math.min(len, clamp(p) * len + 3));
        const angle = Math.atan2(ahead.y - at.y, ahead.x - at.x) * 180 / Math.PI;
        node.setAttribute('transform', `translate(${at.x - 75} ${at.y - 64 + offset}) rotate(${angle} 75 64)`);
      }

      function setRoute(path, p) {
        const len = path.getTotalLength();
        path.style.opacity = p > 0 ? 1 : 0;
        path.style.strokeDasharray = `${len}`;
        path.style.strokeDashoffset = `${len * (1 - clamp(p))}`;
      }

      function setCaption(sceneIndex) {
        if (sceneIndex === activeScene) return;
        activeScene = sceneIndex;
        const s = scenes[sceneIndex];
        caption.classList.remove('show');
        dateStamp.classList.remove('show');
        setTimeout(() => {
          eyebrow.textContent = s.eyebrow;
          headline.textContent = s.headline;
          subline.textContent = s.subline;
          caption.style.display = sceneIndex === 6 ? 'none' : 'block';
          if (s.date) { dateStamp.textContent = s.date; dateStamp.classList.add('show'); }
          if (sceneIndex !== 6) caption.classList.add('show');
        }, 120);
        sceneLabel.textContent = s.name;
      }

      function figures(selector, p, collapse = false) {
        document.querySelectorAll(selector).forEach((node, i) => {
          const appear = clamp((p - i * .08) / .3);
          const vanish = collapse ? 1 - clamp((p - .42 - i * .035) / .35) : 1;
          node.style.opacity = appear * vanish;
          node.style.transform = `translateY(${(1 - appear) * 35}px) scale(${.82 + .18 * appear}) rotate(${Math.sin((p + i) * 4) * 1.4}deg)`;
        });
      }

      function render() {
        const cam = cameraAt(elapsed);
        camera.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;
        progressBar.style.width = `${elapsed / TOTAL * 100}%`;

        const sceneIndex = Math.min(scenes.length - 1, scenes.findIndex(s => elapsed >= s.start && elapsed < s.end));
        setCaption(sceneIndex < 0 ? scenes.length - 1 : sceneIndex);

        const voyage = local(2500, 8000);
        setRoute(routeIberia, ease(voyage));
        shipIberia.style.opacity = voyage > .04 && voyage < .98 ? 1 : 0;
        placeOnPath(shipIberia, routeIberia, ease(voyage));

        const taino = local(8000, 13000);
        tainoWorld.classList.toggle('visible', elapsed >= 8000 && elapsed < 16500);
        figures('.scene-taino .stick', taino, elapsed >= 13000);
        colonialIntrusion.classList.toggle('visible', elapsed >= 11100 && elapsed < 18000);
        if (elapsed >= 13000 && elapsed < 16500) figures('.scene-taino .stick', local(13000, 16500), true);

        const african = local(16500, 22000);
        setRoute(routeAfrica, ease(african));
        shipAfrica.style.opacity = african > .04 && african < .94 ? 1 : 0;
        placeOnPath(shipAfrica, routeAfrica, ease(african), 5);
        africanArrival.classList.toggle('visible', elapsed >= 19600 && elapsed < 27000);
        figures('.scene-africa .stick', local(19600, 22500));

        const society = local(22000, 27000);
        colonialSociety.classList.toggle('visible', elapsed >= 22000 && elapsed < 28600);
        document.querySelectorAll('#mergeFigures .merge').forEach((node, i) => {
          const p = clamp((society - i * .05) / .42);
          const targetX = [165, -75, -320][i];
          node.style.opacity = p;
          node.style.transform = `translate(${targetX * ease(p)}px, ${(1-p)*45}px) scale(${.83 + .17*p})`;
        });
        document.querySelectorAll('#mergeFigures .child').forEach((node, i) => {
          const p = clamp((society - .44 - i * .07) / .34);
          node.style.opacity = p;
          node.style.transform = `translateY(${(1-p)*55}px) scale(${.78 + .22*p})`;
        });

        dnaCard.classList.toggle('show', elapsed >= 27000);
      }

      function tick(now) {
        if (running) {
          elapsed += now - last;
          if (elapsed >= TOTAL) elapsed %= TOTAL;
        }
        last = now;
        render();
        requestAnimationFrame(tick);
      }

      function toggle() {
        running = !running;
        film.classList.toggle('paused', !running);
        playPause.textContent = running ? 'Pause' : 'Play';
        last = performance.now();
      }

      playPause.addEventListener('click', e => { e.stopPropagation(); toggle(); });
      restart.addEventListener('click', e => { e.stopPropagation(); elapsed = 0; activeScene = -1; running = true; film.classList.remove('paused'); playPause.textContent = 'Pause'; });
      film.addEventListener('click', e => { if (!e.target.closest('button')) toggle(); });
      window.addEventListener('keydown', e => {
        if (e.code === 'Space') { e.preventDefault(); toggle(); }
        if (e.key.toLowerCase() === 'r') { elapsed = 0; activeScene = -1; }
      });

      film.classList.toggle('paused', !running);
      playPause.textContent = running ? 'Pause' : 'Play';
      render();
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
